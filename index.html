<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#050612" />
        <meta
            name="description"
            content="Nasze niebo — romantyczna mapa wspólnych wspomnień ukrytych w gwiazdach."
        />
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050612'/%3E%3Cpath d='M32 51S12 39 12 23c0-10 13-14 20-5 7-9 20-5 20 5 0 16-20 28-20 28Z' fill='%23f3c6d8'/%3E%3C/svg%3E"
        />
        <title>Nasze niebo</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main
            class="sky"
            id="sky"
            aria-label="Interaktywne niebo pełne wspomnień"
        >
            <div class="aurora aurora--one" aria-hidden="true"></div>
            <div class="aurora aurora--two" aria-hidden="true"></div>
            <div class="stars stars--tiny" aria-hidden="true"></div>

            <header class="intro">
                <p class="eyebrow">Dla Ciebie</p>
                <h1>Nasze niebo</h1>
                <p>
                    Każda jasna gwiazda skrywa to co zawsze Ci chę powiedzieć.
                </p>
            </header>

            <section
                class="memory-stars"
                id="memoryStars"
                aria-label="Gwiazdy ze wspomnieniami"
            ></section>

            <div class="hint" id="hint" aria-hidden="true">
                <span class="hint__spark">✦</span>
                <span>Dotknij jasnej gwiazdy</span>
            </div>

            <footer class="signature">
                <span aria-hidden="true"></span>
                <span>Kotuś tuptuś</span>
            </footer>
        </main>

        <dialog
            class="memory-dialog"
            id="memoryDialog"
            aria-labelledby="memoryTitle"
        >
            <button
                class="close-button"
                id="closeDialog"
                type="button"
                aria-label="Zamknij wspomnienie"
            >
                <span aria-hidden="true">×</span>
            </button>
            <div class="dialog-star" aria-hidden="true">✦</div>
            <p class="dialog-label">
                Co sprawia, że przy kotusiu jest bardzo pięknie i co jest w
                kotusiu bardzo piękne
            </p>
            <h2 id="memoryTitle"></h2>
            <p class="memory-text" id="memoryText"></p>
            <p class="memory-date" id="memoryDate"></p>
            <div class="dialog-ornament" aria-hidden="true">
                <span></span><i>♥</i><span></span>
            </div>
        </dialog>

        <script src="script.js"></script>
    </body>
</html>
